name: CI and Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package application
        run: |
          tar -czf application.tar.gz -C app .

      - name: Upload application to S3
        id: upload
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          KEY="releases/${GITHUB_SHA}.tar.gz"
          aws s3 cp application.tar.gz "s3://${BUCKET}/${KEY}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy using Systems Manager
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
          KEY: ${{ steps.upload.outputs.key }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          aws s3 cp "$ARTIFACT_URI" "$WORKDIR/app.tar.gz"

          mkdir -p "$WORKDIR/app"
          tar -xzf "$WORKDIR/app.tar.gz" -C "$WORKDIR/app"

          test -f "$WORKDIR/app/package.json"
          test -f "$WORKDIR/app/server.js"

          systemctl stop task-tracker

          cp -a "$WORKDIR/app/." /opt/task-tracker/
          chown -R ec2-user:ec2-user /opt/task-tracker

          cd /opt/task-tracker
          sudo -u ec2-user npm install --omit=dev

          systemctl start task-tracker

          sleep 5
          systemctl is-active --quiet task-tracker
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ > /dev/null

          echo "Deployment successful"
          SCRIPT

          ARTIFACT_URI="s3://${BUCKET}/${KEY}"

          jq -n \
            --arg uri "$ARTIFACT_URI" \
            --arg script "$(cat deploy.sh)" \
            '{
              commands: [
                ("export ARTIFACT_URI=" + ($uri | @sh)),
                $script
              ]
            }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
