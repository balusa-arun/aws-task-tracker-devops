<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Task Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f4f7fb;color:#172033}
header{background:#142b4a;color:white;padding:28px 6%;}header h1{margin:0 0 6px}header p{margin:0;color:#c8d7ed}
main{max-width:850px;margin:36px auto;padding:0 18px}.panel{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 20px #13294a12}
form{display:flex;gap:10px}input{flex:1;padding:12px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px}button{border:0;background:#2563eb;color:white;padding:12px 18px;border-radius:8px;font-weight:600;cursor:pointer}button:hover{background:#1d4ed8}
ul{padding:0}#tasks{list-style:none;padding:0;margin:18px 0 0}#tasks li{padding:14px 12px;border-bottom:1px solid #e5eaf0;display:flex;justify-content:space-between;gap:10px}small{color:#68758a}#status{margin-top:12px;color:#52627a}.pill{font-size:12px;color:#2563eb;background:#eff6ff;padding:4px 8px;border-radius:999px}
</style></head><body>
<header><h1>DevOps Task Tracker</h1><p>Simple app • Express API • DynamoDB • AWS CloudFormation • GitHub Actions integrated with OIDC</p></header>
<main><section class="panel"><h2>Add a task</h2><form id="taskForm"><input id="taskTitle" maxlength="200" placeholder="e.g. Deploy app to EC2" required><button type="submit">Save task</button></form><div id="status"></div><h2>Tasks saved in AWS</h2><ul id="tasks"></ul></section></main>
<script>
const form=document.querySelector('#taskForm'), title=document.querySelector('#taskTitle'), list=document.querySelector('#tasks'), status=document.querySelector('#status');
async function loadTasks(){try{const r=await fetch('/api/tasks');if(!r.ok)throw new Error('API returned '+r.status);const tasks=await r.json();list.innerHTML='';if(!tasks.length){list.innerHTML='<li>No tasks yet. Add one above.</li>';return;}tasks.forEach(t=>{const li=document.createElement('li');const name=document.createElement('span');name.textContent=t.title;const time=document.createElement('small');time.textContent=new Date(t.createdAt).toLocaleString();li.append(name,time);list.append(li);});}catch(e){status.textContent='Unable to load tasks: '+e.message;}}
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';try{const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value})});if(!r.ok){const data=await r.json();throw new Error(data.error||'Save failed');}title.value='';status.textContent='Task saved successfully.';await loadTasks();}catch(e){status.textContent=e.message;}});loadTasks();
</script></body></html>
